<section class="prc">
  <div class="prc-glow parallax-a" aria-hidden="true"></div>
  <div class="prc-inner">
    <div class="prc-head" data-reveal="blur">
      <span class="sec-kicker" data-t="pr_k"></span>
      <h2 class="prc-h2" data-t="pr_t"></h2>
      <p class="prc-s" data-t="pr_s"></p>
      <div class="prc-badges">
        <span class="prc-badge prc-badge-amber" data-t="pr_badge1"></span>
        <span class="prc-badge prc-badge-ghost" data-t="pr_badge2"></span>
      </div>
    </div>

    <div class="prc-grid procgrid" data-role="steps"></div>

    <p class="prc-close" data-reveal data-t="pr_close"></p>
  </div>
</section>
