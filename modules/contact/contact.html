<section class="cnt">
  <div class="cnt-head">
    <span class="sec-kicker" data-t="p_contact_k"></span>
    <h1 class="cnt-h1" data-t="p_contact_t"></h1>
    <p class="sec-sub" data-t="p_contact_s"></p>
  </div>

  <div class="cnt-grid contactgrid">
    <!-- Formulario -->
    <div class="cnt-panel" data-reveal="left">
      <form class="cnt-form" data-role="form">
        <label class="cnt-field"><span data-t="form_name"></span><input required></label>
        <label class="cnt-field"><span data-t="form_email"></span><input type="email" required></label>
        <label class="cnt-field"><span data-t="form_biz"></span><input></label>
        <label class="cnt-field"><span data-t="form_msg"></span><textarea rows="4"></textarea></label>
        <button type="submit" class="btn-amber cnt-submit" data-t="form_send"></button>
      </form>
      <div class="cnt-ok" data-role="ok" hidden>
        <span class="cnt-ok-icon">✅</span>
        <p data-t="form_ok"></p>
      </div>
    </div>

    <!-- Calculadora de retorno -->
    <div data-reveal="right">
      <div class="cnt-panel cnt-roi">
        <h2 class="cnt-roi-t" data-t="roi_t"></h2>
        <p class="cnt-roi-s" data-t="roi_s"></p>
        <div class="cnt-sliders" data-role="sliders"></div>
        <div class="cnt-roi-out" data-role="roi-out"></div>
        <p class="cnt-note" data-t="roi_note"></p>
      </div>
      <div class="cnt-contacts" data-role="contacts"></div>
      <p class="cnt-note" data-t="form_note"></p>
    </div>
  </div>
</section>

<!-- Agenda -->
<section class="cnt-cal-wrap">
  <div class="cnt-panel cnt-cal" data-reveal="scale">
    <div class="cnt-cal-grid calgrid">
      <div>
        <span class="sec-kicker" data-t="cal_k"></span>
        <h2 class="cnt-cal-t" data-t="cal_t"></h2>
        <p class="cnt-cal-s" data-t="cal_s"></p>
        <div class="cnt-cal-bullets">
          <span><i>→</i><span data-t="cal_b1"></span></span>
          <span><i>→</i><span data-t="cal_b2"></span></span>
          <span><i>→</i><span data-t="cal_b3"></span></span>
        </div>
        <p class="cnt-note" data-t="cal_tz"></p>
      </div>
      <div class="cnt-cal-card" data-role="cal"></div>
    </div>
  </div>
</section>

<!-- Preguntas frecuentes -->
<section class="cnt-faq">
  <h2 class="cnt-faq-t" data-t="faq_t"></h2>
  <div class="cnt-faq-list" data-stagger data-role="faq"></div>
</section>
