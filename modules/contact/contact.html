<section class="cnt">
  <div class="cnt-head">
    <span class="sec-kicker" data-t="p_contact_k"></span>
    <h2 class="cnt-h1" data-route-title data-t="p_contact_t"></h2>
    <p class="cnt-h1-sub"><span data-t="p_contact_sub"></span> <span class="wordrot" aria-hidden="true"><span class="wordrot-track" data-role="words"></span></span></p>
    <p class="sec-sub" data-t="p_contact_s"></p>
  </div>

  <!-- Señales de confianza: responden la objeción antes de que el visitante la formule -->
  <div class="cnt-trust">
    <div class="trustrot"><div class="trustrot-track" data-role="trust"></div></div>
  </div>

  <div class="cnt-grid contactgrid">
    <!-- Formulario -->
    <div class="cnt-panel" data-reveal="left">
      <form class="cnt-form" data-role="form" method="POST" action="https://formspree.io/f/myeyonwe">
        <label class="cnt-field" for="cf-name"><span data-t="form_name"></span><input id="cf-name" name="name" type="text" autocomplete="name" required minlength="2"></label>
        <label class="cnt-field" for="cf-email"><span data-t="form_email"></span><input id="cf-email" name="email" type="email" autocomplete="email" required></label>
        <label class="cnt-field" for="cf-phone"><span data-t="form_phone"></span><input id="cf-phone" name="phone" type="tel" autocomplete="tel" pattern="[+]?[0-9\s\-]{7,15}" required></label>
        <label class="cnt-field" for="cf-org"><span data-t="form_biz"></span><input id="cf-org" name="organization" autocomplete="organization"></label>
        <label class="cnt-field" for="cf-msg"><span data-t="form_msg"></span><textarea id="cf-msg" name="message" rows="4" required minlength="10"></textarea></label>
        <button type="submit" class="btn-amber cnt-submit" data-t="form_send"></button>
      </form>
      <div class="cnt-ok" data-role="ok" hidden>
        <span class="cnt-ok-icon">✅</span>
        <p data-t="form_ok"></p>
        <div class="cnt-ok-actions">
          <button type="button" class="btn-amber" data-role="ok-agenda" data-t="form_ok_cta"></button>
          <a class="cnt-ok-wa" data-role="ok-wa" target="_blank" rel="noopener" data-t="form_ok_wa"></a>
        </div>
      </div>
      <div class="cnt-err" data-role="err" hidden>
        <p data-t="form_error"></p>
        <a class="cnt-err-wa" data-role="err-wa" target="_blank" rel="noopener" data-t="form_error_wa"></a>
      </div>
    </div>

    <!-- Calculadora de retorno -->
    <div data-reveal="right">
      <div class="cnt-panel cnt-roi">
        <h2 class="cnt-roi-t" data-t="roi_t"></h2>
        <p class="cnt-roi-s" data-t="roi_s"></p>
        <div class="cnt-sliders" data-role="sliders"></div>
        <div class="cnt-roi-out" data-role="roi-out"></div>
        <p class="cnt-note" data-t="roi_note"></p>
      </div>
      <div class="cnt-contacts" data-role="contacts"></div>
      <p class="cnt-note" data-t="form_note"></p>
    </div>
  </div>
</section>

<!-- Agenda -->
<section class="cnt-cal-wrap">
  <div class="cnt-panel cnt-cal" data-reveal="scale">
    <div class="cnt-cal-grid calgrid">
      <div>
        <span class="sec-kicker" data-t="cal_k"></span>
        <h2 class="cnt-cal-t" data-t="cal_t"></h2>
        <p class="cnt-cal-s" data-t="cal_s"></p>
        <div class="cnt-cal-bullets">
          <span><i>→</i><span data-t="cal_b1"></span></span>
          <span><i>→</i><span data-t="cal_b2"></span></span>
          <span><i>→</i><span data-t="cal_b3"></span></span>
        </div>
        <p class="cnt-note" data-t="cal_tz"></p>
      </div>
      <div class="cnt-cal-card" data-role="cal"></div>
    </div>
  </div>
</section>

<!-- Preguntas frecuentes -->
<section class="cnt-faq">
  <h2 class="cnt-faq-t" data-t="faq_t"></h2>
  <div class="cnt-faq-list" data-stagger data-role="faq"></div>
</section>
