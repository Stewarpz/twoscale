<section class="svc">
  <div class="svc-head">
    <span class="sec-kicker" data-t="p_serv_k"></span>
    <h1 class="svc-h1" data-t="p_serv_t"></h1>
    <p class="sec-sub" data-t="p_serv_s"></p>
  </div>

  <div class="svc-body svcgrid">
    <!-- Índice lateral: los diez servicios, siempre visibles -->
    <nav class="svc-rail svcrail" data-role="rail" aria-label="Servicios"></nav>

    <div>
      <span class="svc-method" data-role="method"></span>
      <h2 class="svc-name" data-role="name"></h2>

      <div class="svc-story svc-story-pas svcstory">
        <div>
          <div class="svc-lbl" data-t="srv_problem"></div>
          <p class="svc-problem" data-role="problem"></p>
        </div>
        <div>
          <div class="svc-lbl svc-lbl-warn" data-t="srv_consequence"></div>
          <p class="svc-problem" data-role="consequence"></p>
        </div>
        <div>
          <div class="svc-lbl svc-lbl-amber" data-t="srv_solution"></div>
          <p class="svc-solution" data-role="solution"></p>
        </div>
      </div>

      <!-- El artefacto: un diagrama distinto por metodología -->
      <div class="svc-artifact">
        <div class="svc-artifact-lbl" data-t="srv_artifact"></div>
        <div data-role="artifact"></div>
      </div>

      <div class="svc-kpis kpigrid" data-role="kpis"></div>

      <div class="svc-story svcstory svc-deliv">
        <div>
          <div class="svc-lbl svc-lbl-cream" data-t="srv_deliv"></div>
          <div class="svc-list" data-role="deliv"></div>
        </div>
        <div>
          <div class="svc-lbl svc-lbl-cream" data-t="srv_meas"></div>
          <div class="svc-list" data-role="meas"></div>
        </div>
      </div>

      <div class="svc-phases">
        <div class="svc-lbl svc-lbl-cream" data-t="srv_phases"></div>
        <div class="svc-phase-row" data-role="phases"></div>
      </div>

      <div class="svc-tools" data-role="tools"></div>
      <a href="#contacto" class="btn-amber svc-cta" data-t="srv_cta"></a>
    </div>
  </div>
</section>
