<section class="live">
  <div class="live-glow parallax-b" aria-hidden="true"></div>
  <div class="live-inner livegrid">
    <div data-reveal="left">
      <span class="sec-kicker" data-t="live_k"></span>
      <h2 class="sec-title" data-t="live_t"></h2>
      <p class="sec-sub" data-t="live_s"></p>
      <div class="live-stats" data-role="stats"></div>
      <button class="btn-amber live-cta" data-role="cta" data-t="live_cta"></button>
    </div>

    <div data-reveal="right" class="live-right">
      <div class="live-aura" aria-hidden="true"></div>
      <div class="live-device">
        <div class="live-screen">
          <header class="live-head">
            <span class="live-avatar" data-role="avatar"></span>
            <span class="live-id">
              <span class="live-name" data-t="chat_demo_t"></span>
              <span class="live-status"><i></i><span data-t="live_online"></span></span>
            </span>
            <span class="live-badge" data-t="live_badge"></span>
          </header>
          <div class="live-log" data-role="log"></div>
          <footer class="live-foot">
            <span class="live-note" data-t="chat_auto"></span>
            <span class="live-typing"><i></i><i></i><i></i></span>
          </footer>
        </div>
      </div>
    </div>
  </div>
</section>
