<div class="mck">
  <!-- Lo que gestiona el sistema -->
  <div class="mck-manages" data-reveal>
    <div class="svc-lbl svc-lbl-amber" data-t="proof_b"></div>
    <div class="mck-manages-grid pillargrid" data-role="manages"></div>
    <p class="cnt-note" data-t="proof_bnote"></p>
  </div>

  <!-- Maqueta 01 · sistema administrativo (Áurea, demo externa en iframe) -->
  <div class="mck-block" data-reveal>
    <div class="mck-cap">
      <span class="mck-cap-k" data-t="mk2_k"></span>
      <span class="mck-cap-t" data-t="mk2_t"></span>
      <span class="mck-cap-s" data-t="mk2_s"></span>
      <span class="mck-cap-tag" data-t="demo_tag"></span>
    </div>
    <div class="mck-aurea" data-role="aurea-zone">
      <div class="mck-aurea-glow" aria-hidden="true"></div>
      <div class="mck-frame mck-frame-dark">
        <div class="mck-chrome mck-chrome-dark">
          <span class="mck-lights mck-lights-dark"><i></i><i></i><i></i></span>
          <span class="mck-url mck-url-dark" data-t="mk2_frame"></span>
        </div>
        <iframe class="mck-iframe" src="aurea-demo.html" loading="lazy" data-role="aurea"></iframe>
      </div>
      <p class="mck-hint" data-t="mk2_hint"></p>
    </div>
  </div>

  <!-- Maqueta 02 · dashboard ejecutivo (demo externa en iframe) -->
  <div class="mck-block" data-reveal>
    <div class="mck-cap">
      <span class="mck-cap-k" data-t="mk3_k"></span>
      <span class="mck-cap-t" data-t="mk3_t"></span>
      <span class="mck-cap-s" data-t="mk3_s"></span>
      <span class="mck-cap-tag" data-t="demo_tag"></span>
    </div>
    <div class="mck-aurea" data-role="dash-zone">
      <div class="mck-aurea-glow" aria-hidden="true"></div>
      <div class="mck-frame mck-frame-dark">
        <div class="mck-chrome mck-chrome-dark">
          <span class="mck-lights mck-lights-dark"><i></i><i></i><i></i></span>
          <span class="mck-url mck-url-dark" data-t="mk3_frame"></span>
        </div>
        <iframe class="mck-iframe mck-iframe-tall" src="TwoscaleDashboard.dc.html?tour=off" loading="lazy" data-role="dash"></iframe>
      </div>
      <p class="mck-hint" data-t="dash_hint"></p>
    </div>
  </div>
</div>
