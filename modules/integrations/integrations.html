<section class="integ">
  <div data-reveal="blur" class="integ-head">
    <span class="sec-kicker" data-t="integ_kicker"></span>
    <h2 class="sec-title" data-t="integ_title"></h2>
    <p class="sec-sub" data-t="integ_sub"></p>
  </div>

  <!-- Grupos destacados: lo que el cliente reconoce primero -->
  <div class="integ-groups" data-role="groups"></div>

  <!-- Muro completo, en cintas que se desplazan -->
  <div class="integ-ribbons mqmask" data-role="ribbons"></div>

  <div class="integ-count">
    <span class="integ-count-n" data-role="count"></span>
    <span class="integ-count-l" data-t="integ_drop"></span>
  </div>
</section>
