<!-- Lanzador -->
<button class="ag-launcher agent-rest" data-role="launcher" data-t-aria="ag_open" hidden>
  <span class="ag-launcher-icon" data-role="launcher-icon"><i class="ag-online"></i></span>
  <span class="ag-launcher-label" data-t="ag_open"></span>
</button>

<!-- Panel -->
<div class="ag-panel" data-role="panel" hidden>
  <header class="ag-head">
    <span class="ag-avatar" data-role="avatar"><i class="ag-online ag-online-lg"></i></span>
    <span class="ag-id">
      <span class="ag-name" data-t="ag_name"></span>
      <span class="ag-role" data-t="ag_role"></span>
    </span>
    <button class="ag-close" data-role="close" aria-label="Cerrar">✕</button>
  </header>

  <div class="ag-progress"><div class="ag-progress-bar" data-role="bar"></div></div>

  <div class="ag-log" data-role="log"></div>

  <footer class="ag-foot" data-role="foot"></footer>
</div>
