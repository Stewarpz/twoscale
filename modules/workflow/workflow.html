<div class="wf" data-reveal>
  <div class="wf-cap">
    <span class="wf-cap-k" data-t="wf_kicker_s"></span>
    <span class="wf-cap-t" data-t="wf_title"></span>
    <span class="wf-cap-s" data-t="wf_sub"></span>
  </div>

  <div class="wf-stage">
    <span class="wf-stage-n" data-role="stage-n"></span>
    <span class="wf-stage-l" data-role="stage-l"></span>
  </div>

  <div class="wf-viewport">
    <div class="wf-canvas" data-role="canvas"></div>
  </div>

  <div class="wf-chips" data-role="chips"></div>

  <div class="wf-detail">
    <span class="wf-detail-badge" data-role="detail-badge"></span>
    <div>
      <div class="wf-detail-t">
        <span data-role="detail-label"></span>
        <span class="wf-detail-role" data-role="detail-role"></span>
      </div>
      <div class="wf-detail-info" data-role="detail-info"></div>
    </div>
  </div>

  <p class="wf-hint" data-t="wf_hint"></p>
</div>
