<section class="hero">
  <div class="hero-grid" aria-hidden="true"></div>
  <div class="hero-glow hero-glow-a parallax-a" aria-hidden="true"></div>
  <div class="hero-glow hero-glow-b parallax-b" aria-hidden="true"></div>

  <div class="hero-inner herogrid">
    <div>
      <span class="hero-kicker"><i class="hero-dot"></i><span data-t="hero_kicker"></span></span>
      <h2 class="hero-title">
        <span data-t="hero_title_1"></span><br>
        <span class="hero-title-accent" data-t="hero_title_2"></span>
      </h2>
      <p class="hero-sub" data-t="hero_sub"></p>
      <div class="hero-ctas">
        <a href="#contacto" class="btn-amber" data-t="hero_cta1"></a>
        <a href="#servicios" class="btn-ghost" data-t="hero_cta2"></a>
      </div>
      <div class="hero-pills" data-role="pills"></div>
    </div>

    <div data-reveal="right">
      <div class="hero-card">
        <div class="hero-card-head">
          <span class="hero-card-label">LIVE · AUTOMATION</span>
          <span class="hero-card-dots"><i class="hero-blink"></i><i class="hero-idle"></i></span>
        </div>
        <div data-role="flow"></div>
      </div>
    </div>
  </div>
</section>
